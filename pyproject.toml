[build-system]
# >=1.27 is the floor for PEP 639 (SPDX `license` expression + `license-files`,
# metadata 2.4). An older hatchling silently ignores both and ships a wheel with
# no declared license at all.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-saga"
dynamic = ["version"]
description = "Never worry about your AI agent breaking production again. Kill the process mid-flight — the wire transfer is still safely refunded, your database stays clean, and your users never lose trust. agent-saga is the 1-line bulletproof safety OS that turns unpredictable LLMs into crash-proof, enterprise-grade autonomous engines."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
# NOTICE is required downstream by Apache-2.0 section 4(d); TRADEMARKS.md states
# the section 6 carve-out. Both travel with the wheel, not just the repo.
license-files = ["LICENSE", "NOTICE", "TRADEMARKS.md"]
authors = [{ name = "SAGAOPS Enterprise (Thomas J George)" }]
maintainers = [{ name = "Thomas J George (SAGAOPS Enterprise)", email = "thomasjgeorge23@gmail.com" }]
keywords = [
    "ai-agents", "agent", "llm", "saga", "rollback", "compensation",
    "write-ahead-log", "wal", "crash-recovery", "transactions", "idempotency",
    "observability", "opentelemetry", "guardrails", "agent-safety",
    "langchain", "crewai", "autogen", "llamaindex", "openai", "anthropic", "gemini",
    "mcp", "mcp-server", "model-context-protocol", "fastapi", "pydantic",
    "durable-execution", "temporal-alternative", "function-calling", "state-machine", "workflow-engine",
    "numpy", "pandas", "requests", "boto3", "pytest", "ai-framework", "production-ready",
]
classifiers = [
    # No `License ::` classifier: PEP 639 deprecates it in favour of the SPDX
    # expression above, and PyPI rejects a distribution that carries both.
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Recovery Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/thomasjgeorge23/agent-saga"
Documentation = "https://github.com/thomasjgeorge23/agent-saga#readme"
Repository = "https://github.com/thomasjgeorge23/agent-saga"
"Source Code" = "https://github.com/thomasjgeorge23/agent-saga"
"Bug Tracker" = "https://github.com/thomasjgeorge23/agent-saga/issues"
"GitHub Profile" = "https://github.com/thomasjgeorge23"

[project.optional-dependencies]
# Everything the full test suite needs. CI installs exactly this, so a gate that
# runs `pytest -q` must not hit an ImportError for an optional backend.
dev = ["pytest>=7.4", "langchain-core>=0.3", "cryptography>=41.0", "PyYAML>=6.0"]

# -- backing stores ----------------------------------------------------------
# redis: RedisWAL, RedisLimitStore, RedisApprovalStore, RedisSwitchStore.
# redis-py >=5 bundles the asyncio client (redis.asyncio) the stores use.
redis = ["redis>=5.0.0"]
# postgres: PostgresWAL + PostgresApprovalStore (asyncpg) and SQLAlchemyAdapter
# (SQLAlchemy 2.0-style select/update/delete/inspect).
postgres = ["asyncpg>=0.28.0", "sqlalchemy>=2.0"]

# -- observability -----------------------------------------------------------
# otel: setup_telemetry() drives the OpenTelemetry SDK. OTLPExporter itself is
# native (stdlib json+urllib) and needs nothing here.
otel = ["opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0"]
opentelemetry = ["opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0"]  # alias

# -- integrations ------------------------------------------------------------
# slack: SlackBlockKitApp and the webhook notifiers are pure stdlib, so this
# extra pulls no third-party package. It exists so `pip install agent-saga[slack]`
# is a valid, self-documenting install target and stays stable if a future
# transport ever adds a dependency.
slack = []
stripe = ["stripe>=5.0"]
salesforce = ["httpx>=0.24"]
encryption = ["cryptography>=41.0"]

# -- agent framework adapters ------------------------------------------------
langgraph = ["langchain-core>=0.3", "langgraph>=0.2"]
crewai = ["crewai"]
openai-agents = ["openai-agents"]
llamaindex = ["llama-index-core>=0.11"]
autogen = ["autogen-core>=0.4"]
semantic-kernel = ["semantic-kernel>=1.0"]
vertexai = ["google-cloud-aiplatform>=1.60"]

# -- everything --------------------------------------------------------------
all = [
    # stores
    "redis>=5.0.0", "asyncpg>=0.28.0", "sqlalchemy>=2.0",
    # observability
    "opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0",
    # integrations
    "stripe>=5.0", "httpx>=0.24", "cryptography>=41.0",
    # framework adapters
    "langchain-core>=0.3", "langgraph>=0.2", "crewai", "openai-agents",
    "llama-index-core>=0.11", "autogen-core>=0.4",
    "semantic-kernel>=1.0", "google-cloud-aiplatform>=1.60",
]

[project.scripts]
agent-saga = "agent_saga.cli:main"

# Ships the saga testing fixtures (saga_wal, chaos_runner,
# assert_saga_deterministic) to any project that installs agent-saga.
[project.entry-points.pytest11]
agent_saga = "agent_saga.pytest_plugin"

[tool.hatch.version]
# Single source of truth: agent_saga/_version.py. The runtime attribute, the CLI
# banner, and this wheel's metadata all read the same string.
path = "agent_saga/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["agent_saga"]
# The dashboard is a data file, not a module -- ship it in the wheel.
artifacts = ["agent_saga/ui/templates/*.html"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.claude",
  "/.gemini",
  "/.antigravity",
  "/.cursor",
  "/.copilot",
  "/brain",
  "/scratch",
  "/*.log",
  "/inquiries.json",
  "/.saga_inquiries.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = ["error"]
