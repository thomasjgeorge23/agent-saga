[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-agent-saga"
version = "2.0.3"
description = "Pytest plugin for agent-saga: deterministic replay verification, chaos injection, and WAL fixtures."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["pytest", "agent-saga", "saga", "ai-agents", "testing", "chaos-engineering"]
authors = [
    { name = "SAGAOPS Enterprise (Thomas J George)" }
]
maintainers = [
    { name = "Thomas J George (SAGAOPS Enterprise)", email = "thomasjgeorge23@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pytest>=7.0.0",
    "agent-saga>=0.2.3",
]

[project.urls]
Homepage = "https://github.com/thomasjgeorge23/agent-saga"
Documentation = "https://github.com/thomasjgeorge23/agent-saga#readme"
Repository = "https://github.com/thomasjgeorge23/agent-saga"
"Source Code" = "https://github.com/thomasjgeorge23/agent-saga"
"Bug Tracker" = "https://github.com/thomasjgeorge23/agent-saga/issues"
"GitHub Profile" = "https://github.com/thomasjgeorge23"

[project.entry-points.pytest11]
pytest_agent_saga = "pytest_agent_saga.plugin"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.claude",
  "/.gemini",
  "/.antigravity",
  "/.cursor",
  "/.copilot",
  "/brain",
  "/scratch",
  "/*.log",
  "/inquiries.json",
  "/.saga_inquiries.json",
]
